<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viniz - Music Stats</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="glass-container">
        <header>
            <h1>Viniz</h1>
            <p>Your beautiful music statistics</p>
        </header>

        <section id="summary-section">
            <div class="summary-cards">
                <div class="card">
                    <h3>Total Plays</h3>
                    <p id="total-plays">0</p>
                </div>
                <div class="card">
                    <h3>Total Playtime</h3>
                    <p id="total-playtime">0h 0m</p>
                </div>
                <div class="card">
                    <h3>Total Views</h3>
                    <p id="total-views">0</p>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="summaryPieChart"></canvas>
            </div>
        </section>

        <section id="lists-section">
            <div class="list-container" id="top-tracks-container">
                <div class="list-header">
                    <h2>Top Tracks</h2>
                    <select class="time-toggler" data-target="top-tracks">
                        <option value="today">Today</option>
                        <option value="7d">Last 7 Days</option>
                        <option value="14d">Last 14 Days</option>
                        <option value="1m">Last 1 Month</option>
                        <option value="3m">Last 3 Months</option>
                        <option value="6m">Last 6 Months</option>
                        <option value="all">All Time</option>
                    </select>
                </div>
                <ul id="top-tracks-list" class="stats-list"></ul>
            </div>

            <div class="list-container" id="top-albums-container">
                <div class="list-header">
                    <h2>Top Albums</h2>
                    <select class="time-toggler" data-target="top-albums">
                        <option value="today">Today</option>
                        <option value="7d">Last 7 Days</option>
                        <option value="14d">Last 14 Days</option>
                        <option value="1m">Last 1 Month</option>
                        <option value="3m">Last 3 Months</option>
                        <option value="6m">Last 6 Months</option>
                        <option value="all">All Time</option>
                    </select>
                </div>
                <ul id="top-albums-list" class="stats-list"></ul>
            </div>

            <div class="list-container" id="top-artists-container">
                <div class="list-header">
                    <h2>Top Artists</h2>
                    <select class="time-toggler" data-target="top-artists">
                        <option value="today">Today</option>
                        <option value="7d">Last 7 Days</option>
                        <option value="14d">Last 14 Days</option>
                        <option value="1m">Last 1 Month</option>
                        <option value="3m">Last 3 Months</option>
                        <option value="6m">Last 6 Months</option>
                        <option value="all">All Time</option>
                    </select>
                </div>
                <ul id="top-artists-list" class="stats-list"></ul>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
