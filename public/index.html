<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viniz - Music Stats</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <div class="header-content">
                <h1>Viniz</h1>
                <p>Your listening history, beautifully visualized.</p>
            </div>
        </header>

        <main class="dashboard">
            <section id="summary-section">
                <div class="summary-grid">
                    <div class="summary-card stat-card">
                        <div class="stat-icon">▶</div>
                        <div class="stat-details">
                            <h3>Total Plays</h3>
                            <p id="total-plays">0</p>
                        </div>
                    </div>
                    <div class="summary-card stat-card">
                        <div class="stat-icon">🕒</div>
                        <div class="stat-details">
                            <h3>Total Playtime</h3>
                            <p id="total-playtime">0h 0m</p>
                        </div>
                    </div>
                    <div class="summary-card stat-card">
                        <div class="stat-icon">👀</div>
                        <div class="stat-details">
                            <h3>Total Views</h3>
                            <p id="total-views">0</p>
                        </div>
                    </div>
                </div>
                <div class="summary-card chart-card">
                    <canvas id="summaryPieChart"></canvas>
                </div>
            </section>

            <section id="lists-section">
                <div class="list-container" id="top-tracks-container">
                    <div class="list-header">
                        <h2>Top Songs</h2>
                        <select class="time-toggler" data-target="top-tracks">
                            <option value="today">Today</option>
                            <option value="7d">Last 7 Days</option>
                            <option value="14d">Last 14 Days</option>
                            <option value="1m">Last 1 Month</option>
                            <option value="3m">Last 3 Months</option>
                            <option value="6m">Last 6 Months</option>
                            <option value="all">All Time</option>
                        </select>
                    </div>
                    <ul id="top-tracks-list" class="stats-list"></ul>
                </div>

                <div class="list-container" id="top-albums-container">
                    <div class="list-header">
                        <h2>Top Albums</h2>
                        <select class="time-toggler" data-target="top-albums">
                            <option value="today">Today</option>
                            <option value="7d">Last 7 Days</option>
                            <option value="14d">Last 14 Days</option>
                            <option value="1m">Last 1 Month</option>
                            <option value="3m">Last 3 Months</option>
                            <option value="6m">Last 6 Months</option>
                            <option value="all">All Time</option>
                        </select>
                    </div>
                    <ul id="top-albums-list" class="stats-list"></ul>
                </div>

                <div class="list-container" id="top-artists-container">
                    <div class="list-header">
                        <h2>Top Artists</h2>
                        <select class="time-toggler" data-target="top-artists">
                            <option value="today">Today</option>
                            <option value="7d">Last 7 Days</option>
                            <option value="14d">Last 14 Days</option>
                            <option value="1m">Last 1 Month</option>
                            <option value="3m">Last 3 Months</option>
                            <option value="6m">Last 6 Months</option>
                            <option value="all">All Time</option>
                        </select>
                    </div>
                    <ul id="top-artists-list" class="stats-list"></ul>
                </div>
            </section>
        </main>
    </div>

    <!-- Artist Detail Modal -->
    <div id="artist-modal" class="modal-overlay">
        <div class="modal-content">
            <button id="close-modal" class="close-btn">&times;</button>
            
            <div class="modal-header">
                <img id="modal-artist-image" src="" alt="Artist" class="modal-artist-image">
                <div class="modal-artist-info">
                    <h2 id="modal-artist-name">Artist Name</h2>
                    <div class="modal-artist-stats">
                        <span id="modal-artist-plays">0 plays</span> &bull; 
                        <span id="modal-artist-playtime">0h 0m</span>
                    </div>
                </div>
            </div>

            <div class="modal-body">
                <div class="modal-section">
                    <h3>Top Songs</h3>
                    <ul id="modal-top-tracks" class="stats-list compact-list"></ul>
                </div>
                <div class="modal-section">
                    <h3>Top Albums</h3>
                    <ul id="modal-top-albums" class="stats-list compact-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
