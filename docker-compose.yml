version: '3.8'

services:
  viniz:
    build: .
    container_name: viniz
    restart: unless-stopped
    ports:
      - "4096:4096"
    volumes:
      - ./data:/app/data
      # Make sure to point this to your actual Navidrome database file
      - /path/to/your/navidrome.db:/app/navidrome/navidrome.db:ro
    environment:
      - NODE_ENV=production
      - NAVIDROME_DB_PATH=/app/navidrome/navidrome.db
      - NAVIDROME_HOST=navidrome
      - NAVIDROME_PORT=4533
      - NAVIDROME_USER=admin
      - NAVIDROME_PASS=your_password_here
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4096/apis/listenbrainz/1/validate-token"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - nextcloud_network

networks:
  nextcloud_network:
    external: true
